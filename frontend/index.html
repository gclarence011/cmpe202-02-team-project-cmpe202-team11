<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus Marketplace – Buy and sell within your university community" />
    <title>Campus Marketplace</title>

    <!-- ✅ Load runtime environment (backend API base URL) -->
    <script src="/env.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Fonts (optional, you can customize) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind base styles are injected by Vite build -->
  </head>

  <body class="min-h-screen bg-gray-50 text-gray-900">
    <!-- React app will mount here -->
    <div id="root"></div>

    <!-- Vite automatically injects the bundled JS -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
