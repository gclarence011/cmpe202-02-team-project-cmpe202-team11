name: Build and Push to ECR

on:
  push:
    branches: ["Deploy"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch secrets from AWS Secrets Manager
        run: |
          export SPRING_DATASOURCE_USERNAME=$(aws secretsmanager get-secret-value --secret-id marketplace/backend/db_username --query SecretString --output text)
          export SPRING_DATASOURCE_PASSWORD=$(aws secretsmanager get-secret-value --secret-id marketplace/backend/db_password --query SecretString --output text)
          export COGNITO_CLIENT_SECRET=$(aws secretsmanager get-secret-value --secret-id marketplace/backend/cognito_client_secret --query SecretString --output text)
          export S3_ACCESS_KEY=$(aws secretsmanager get-secret-value --secret-id marketplace/backend/s3_access_key --query SecretString --output text)
          export S3_SECRET_KEY=$(aws secretsmanager get-secret-value --secret-id marketplace/backend/s3_secret_key --query SecretString --output text)
          export GOOGLE_API_KEY=$(aws secretsmanager get-secret-value --secret-id marketplace/backend/google_api_key --query SecretString --output text)
          echo "SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD" >> $GITHUB_ENV
          echo "COGNITO_CLIENT_SECRET=$COGNITO_CLIENT_SECRET" >> $GITHUB_ENV
          echo "S3_ACCESS_KEY=$S3_ACCESS_KEY" >> $GITHUB_ENV
          echo "S3_SECRET_KEY=$S3_SECRET_KEY" >> $GITHUB_ENV
          echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" >> $GITHUB_ENV

      - name: Build and Push ARM64 image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
          SPRING_DATASOURCE_USERNAME: ${{ env.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.SPRING_DATASOURCE_PASSWORD }}
          COGNITO_CLIENT_SECRET: ${{ env.COGNITO_CLIENT_SECRET }}
          S3_ACCESS_KEY: ${{ env.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ env.S3_SECRET_KEY }}
          GOOGLE_API_KEY: ${{ env.GOOGLE_API_KEY }}
        run: |
          cd backend
          # Enable Docker Buildx
          docker buildx create --use
          # Build ARM64 image and push to ECR
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f Dockerfile . \
            --build-arg SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME \
            --build-arg SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD \
            --build-arg COGNITO_CLIENT_SECRET=$COGNITO_CLIENT_SECRET \
            --build-arg S3_ACCESS_KEY=$S3_ACCESS_KEY \
            --build-arg S3_SECRET_KEY=$S3_SECRET_KEY \
            --build-arg GOOGLE_API_KEY=$GOOGLE_API_KEY \
            --push
