spring.application.name=backend

# Frontend URL change to 5173  for local dev
frontend.url=http://localhost:3000

# S3 Config
cloud.aws.credentials.access_key = #add access key
cloud.aws.credentials.secret_key = #add secret key
cloud.aws.region.static = us-east-2

aws.bucket.name = s3-marketplace-image

# Database connection
spring.datasource.url=jdbc:postgresql://market-place-database.chakkagimn20.us-east-2.rds.amazonaws.com:5432/marketplacedb
spring.datasource.username=#add db username
spring.datasource.password=#add db password

# Cognito connection
cognito.client_id=your-client-id-here
cognito.client_secret=your-secret-here 
cognito.domain=us-west-1rxv8v92ch.auth.us-west-1.amazoncognito.com
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-west-1.amazonaws.com/us-west-1_rxV8V92Ch

cognito.redirect_uri=${frontend.url}

# JPA / Hibernate setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

