name: Full CI/CD Pipeline

on:
  push:
    branches: 
    - main
    - ci-test
  pull_request:
    branches: 
    - main
    - ci-test

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
      # 2. Chekc if secret is set
      - name: Check secret
        run: |
          if [ -z "${{ secrets.DB_USERNAME }}" ]; then
            echo "Secret not set"
            exit 1 
          else
            echo "Secret is available"
          fi

      # 3. Run tests
      - name: Run tests
        working-directory: backend
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://market-place-database.chakkagimn20.us-east-2.rds.amazonaws.com:5432/marketplacedb
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          
          CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          CLOUD_AWS_REGION_STATIC: us-east-2
          AWS_BUCKET_NAME: s3-marketplace-image


      # 4. Set up Docker Buildx (for building images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and run Docker Compose services
      - name: Build and run services
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d
